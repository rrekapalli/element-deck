# Element Deck PWA — static nginx on one LXC. No API process.
# Secrets stay in the repo-root .env

ELEMENT_DECK_VMID=6101
ELEMENT_DECK_CONTAINER_NAME=elementdeck
# Accepted on the same VMID without --recreate.
ELEMENT_DECK_CONTAINER_ALIASES=element-deck
ELEMENT_DECK_HOST=elementdeck.tailce422e.ts.net

# Static nginx base (no Java). Same template Ideate's app LXC clones.
ELEMENT_DECK_CLONE_TEMPLATE=moneytree-lxc-frontend-base
CLONE_TEMPLATE_VMID=9002

ELEMENT_DECK_CORES=1
ELEMENT_DECK_MEMORY_MB=512
ELEMENT_DECK_ROOTFS_GB=8

UI_PORT=80

ELEMENT_DECK_WEB_ROOT=/var/www/element-deck
ELEMENT_DECK_DEPLOY_ROOT=/opt/element-deck

LXC_ROOTFS_STORAGE=local-storage
