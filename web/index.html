  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #080C14;
      color-scheme: dark;
    }
    flt-glass-pane, flutter-view {
      background: #080C14;
    }
    #splash {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080C14;
      pointer-events: none;
    }
    #splash .name {
      margin: 18px 0 0;
      color: #F8FAFC;
      font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.3px;
    }
    #splash .eyebrow {
      margin: 6px 0 0;
      color: #94A3B8;
      font: 600 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 1.6px;
    }

  <div id="splash" aria-hidden="true">
    <!-- splash-mark -->
    <svg width="104.00" height="104.00" viewBox="0 0 104.00 104.00" aria-hidden="true">

          <stop offset="1" stop-color="#D2E4F2" stop-opacity="0.34"/>
        </linearGradient>
      </defs>
      <g clip-path="url(#deck-glass)">
        <rect x="8.32" y="8.32" width="87.36" height="87.36" fill="url(#deck-frost)"/>

      <rect x="8.32" y="8.32" width="87.36" height="87.36" rx="19.22" fill="none" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="1"/>
      <g transform="translate(52.00 52.00) rotate(-24.06)">
        <ellipse cx="0" cy="0" rx="29.70" ry="18.35" fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="1 2"/>
      </g>
      <text x="52.00" y="52.00" text-anchor="middle" dominant-baseline="central" fill="#0B1B33" font-size="43.68" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">E</text>
      <g transform="translate(52.00 52.00) rotate(-24.06)">
        <circle cx="25.32" cy="-9.59" r="2.27" fill="#E4B84A"/>
      </g>
    </svg>
    <!-- /splash-mark -->
    <p class="name">Element Deck</p>
    <p class="eyebrow">PERIODIC EXPLORER</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) splash.remove();
    });
