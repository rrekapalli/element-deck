    html, body {

      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #080C14;
      pointer-events: none;
    }
    #splash .name {
      margin: 18px 0 0;
      color: #F8FAFC;
      font: 700 22px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: -0.3px;

      color: #94A3B8;
